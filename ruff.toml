# Ruff lint configuration.
#
# Ruff 0.16 widened its implicit default rule set (BLE, TRY, PLW, DTZ, UP, ...),
# so the selection is pinned explicitly here: the pre-0.16 defaults
# (E4, E7, E9, F) plus import sorting (I) and dict()/list()/tuple() literal
# calls (C408). Adopting any further rule family should be its own change.

[lint]
select = ["E4", "E7", "E9", "F", "I", "C408"]

[lint.per-file-ignores]
# Entry points load .env (and tests adjust sys.path) before importing lib
# modules, so module-level imports cannot all sit at the top of the file.
"generate.py" = ["E402"]
"mcp_server.py" = ["E402"]
"tests/conftest.py" = ["E402"]
